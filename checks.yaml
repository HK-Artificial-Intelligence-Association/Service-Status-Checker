      port: 4001

    - name: Dify - 大模型总结生成系统
      serviceType: 内部服务
      type: port
      host: api.newsdiy.cn
      port: 4006

    - name: 飞书Bot通知监控
      serviceType: 内部服务
      type: port
      host: api.newsdiy.cn
      port: 3333

    - name: API中台服务
