      expected_code: 200

    - name: Dify 前端
      serviceType: 内部服务
      type: http
      host: http://api.newsdiy.cn
      url: http://api.newsdiy.cn:4006
      expected_code: 200

- title: '内部API端点状态监控'
  checks:
    - name: 【AI头条】内容爬取生成系统
      serviceType: 内部服务
      type: port
      host: api.newsdiy.cn
      port: 4000

    - name: 【AI头条】信息推送系统
